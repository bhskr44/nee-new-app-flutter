name: nee_construction_app
description: "NEE Platform - Complete Construction Platform for Assam"
publish_to: 'none'
version: 3.3.5+335

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # HTTP & API
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Navigation with deep links
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Deep links
  app_links: ^6.4.0

  # Device location (onboarding "use my current location" via Google Places/Geocoding)
  geolocator: ^13.0.2

  # Image & File
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  file_picker: ^8.0.0

  # Video playback (Community feed)
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Audio recording (building-estimate voice memo)
  record: ^6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

  # Payment
  razorpay_flutter: ^1.3.7

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.4

  # SMS OTP auto-read (Android)
  sms_autofill: ^2.4.0

  # Truecaller 1-tap login (Android) — instant, no OTP needed
  truecaller_sdk: ^1.2.0

  # "Continue with Google" — the phone number is verified separately afterwards
  google_sign_in: ^7.2.0

  # PDF generation & print/share
  pdf: ^3.11.1
  printing: ^5.13.1

  # Play Store Install Referrer (tracks which invite link triggered install)
  play_install_referrer: ^0.5.0

  # Read current app version for force-update check
  package_info_plus: ^8.3.0

  # UI
  shimmer: ^3.0.0
  badges: ^3.1.2

  # Splash screen
  flutter_native_splash: ^2.4.3

  # Analytics
  clarity_flutter: ^1.9.0
  change_package_name: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  shorebird_code_push: ^2.0.7
  restart_app: ^1.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.jpeg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/logo.jpeg"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  macos:
    generate: true
    image_path: "assets/icons/logo.jpeg"
  windows:
    generate: true
    image_path: "assets/icons/logo.jpeg"
    icon_size: 256

  # To bundle Poppins locally (recommended for production/offline):
  #   1. Download Poppins from https://fonts.google.com/specimen/Poppins
  #   2. Place the .ttf files in assets/fonts/Poppins/
  #   3. Uncomment the section below and remove the google_fonts dependency.
  #
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins/Poppins-Bold.ttf
  #         weight: 700
