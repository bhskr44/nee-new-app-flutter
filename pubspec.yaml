name: nee_construction_app
description: "NEE Construction - Complete Construction Platform for Assam"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # HTTP & API
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Navigation with deep links
  go_router: ^14.6.3

  # Firebase
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Local notifications
  flutter_local_notifications: ^18.0.1

  # Deep links
  app_links: ^6.4.0

  # Image
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.4

  # SMS OTP auto-read (Android)
  sms_autofill: ^2.4.0

  # UI
  shimmer: ^3.0.0
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  # To bundle Poppins locally (recommended for production/offline):
  #   1. Download Poppins from https://fonts.google.com/specimen/Poppins
  #   2. Place the .ttf files in assets/fonts/Poppins/
  #   3. Uncomment the section below and remove the google_fonts dependency.
  #
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins/Poppins-Bold.ttf
  #         weight: 700
